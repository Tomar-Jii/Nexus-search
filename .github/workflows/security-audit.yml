name: Security & Privacy Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security, Leak Prevention & Policy Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fail-Closed Tor & Privacy Policy Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.TorSecurityAndPersonaTest" --no-daemon

      - name: Run Full Test Suite
        run: gradle testDebugUnitTest --no-daemon

      - name: Verify Secret & Credential Exclusion
        run: |
          echo "Scanning for accidental hardcoded secrets..."
          if grep -rnw --exclude-dir={build,.gradle,.git} -E "AIzaSy[0-9A-Za-z_-]{33}" . ; then
            echo "::error::Found potential hardcoded Google API keys!"
            exit 1
          fi
          echo "No naked secrets found in source files."
